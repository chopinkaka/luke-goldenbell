<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누가복음 골든벨</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. A swipeable deck of quiz cards and a chapter-by-chapter reader share a bottom tab bar. */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --surface-2: #E8ECF5;
  --ink: #18203A;
  --muted: #5B6582;
  --line: #D7DDEA;
  --gold: #9A6A08;
  --gold-strong: #C99014;
  --gold-soft: #F7EBCB;
  --ok: #1B7650;
  --no: #C13A29;
  --scrim: rgba(12, 17, 33, .46);
  --shadow: 0 1px 2px rgba(24, 32, 58, .06), 0 14px 34px rgba(24, 32, 58, .11);
  --font-display: "Hahmlet", "Noto Serif KR", "AppleMyungjo", serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-scripture: "Gowun Batang", "Noto Serif KR", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1322; --surface: #161D31; --surface-2: #1F2842; --ink: #E7EAF4; --muted: #98A1BE;
    --line: #2B3453; --gold: #E6B85A; --gold-strong: #EFC46B; --gold-soft: rgba(230, 184, 90, .17);
    --ok: #52C690; --no: #F2785F; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 34px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1322; --surface: #161D31; --surface-2: #1F2842; --ink: #E7EAF4; --muted: #98A1BE;
  --line: #2B3453; --gold: #E6B85A; --gold-strong: #EFC46B; --gold-soft: rgba(230, 184, 90, .17);
  --ok: #52C690; --no: #F2785F; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 34px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card:focus-visible, .v.has-q:focus-visible { outline: 2.5px solid var(--gold-strong); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.app { height: 100%; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Quiz ---------- */
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; color: var(--gold-strong); flex: none; }
.deck-btn {
  min-width: 0; max-width: 60%; display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; font-weight: 500;
}
.deck-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-btn svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.progress { display: flex; align-items: center; gap: 10px; padding-block: 0 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress b { color: var(--ink); font-weight: 600; }
.bar { flex: 1; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold-strong); border-radius: inherit; transition: width .25s ease; }

.stage { flex: 1; min-height: 0; display: flex; padding-block: 2px 18px; }
.stack { position: relative; flex: 1; width: 100%; max-width: 560px; margin-inline: auto; }
.stack::before {
  content: ""; position: absolute; inset: 0; z-index: 0; border-radius: 22px;
  background: var(--surface); border: 1px solid var(--line); transform: translateY(10px) scale(.94); opacity: .7;
}
.card {
  position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; overflow: hidden;
}
.card * { touch-action: pan-y; }
.card-top { display: flex; align-items: center; gap: 8px; padding: 14px 10px 0 20px; }
.badge { font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 3px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); white-space: nowrap; }
.qno { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.star { margin-left: auto; width: 44px; height: 44px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); border-radius: 12px; }
.star[aria-pressed="true"] { color: var(--gold-strong); }
.card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 22px 12px; display: flex; flex-direction: column; gap: 16px; }
.card-body > :first-child { margin-top: auto; }
.card-body > :last-child { margin-bottom: auto; }
.prompt { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.q { margin: 0; font-size: clamp(20px, 5.3vw, 27px); font-weight: 600; line-height: 1.55; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; text-wrap: pretty; }
.q.quote { font-family: var(--font-scripture); font-weight: 700; line-height: 1.7; }
.blank { display: inline-block; min-width: 4.2em; padding: 0 .25em; margin: 0 .1em; border-bottom: 2.5px solid var(--gold-strong); text-align: center; line-height: 1.3; }
.blank .fill { visibility: hidden; color: var(--gold); }
.card.revealed .blank .fill { visibility: visible; }

.choices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.choices li { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 17px; word-break: keep-all; transition: opacity .2s, background .2s; }
.choices .num { color: var(--muted); font-weight: 600; }
.card.revealed .choices li.correct { border-color: var(--gold-strong); background: var(--gold-soft); font-weight: 600; }
.card.revealed .choices li.correct .num { color: var(--gold); }
.card.revealed .choices li:not(.correct) { opacity: .42; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match ul, .items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; align-content: start; }
.match li, .items li { display: flex; gap: 8px; align-items: baseline; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 16px; word-break: keep-all; min-width: 0; }
.match .k, .items .k { color: var(--gold); font-weight: 700; flex: none; }

.answer-area { display: none; padding: 0 22px 20px; }
.card.revealed .answer-area { display: block; animation: rise .24s ease-out; }
.ans-label { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.ans { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 6.6vw, 34px); line-height: 1.3; color: var(--gold); word-break: keep-all; overflow-wrap: anywhere; }
.ans-note { margin-top: 2px; color: var(--muted); font-size: 15px; word-break: keep-all; }
.ox-row { display: flex; align-items: center; gap: 14px; }
.ox-mark { font-family: var(--font-display); font-size: 60px; line-height: 1; font-weight: 700; }
.ox-mark.o { color: var(--ok); }
.ox-mark.x { color: var(--no); }
.pairs, .order { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 16px; word-break: keep-all; }
.pairs li, .order li { display: flex; gap: 8px; align-items: baseline; }
.pairs .arrow { color: var(--gold); font-weight: 700; }
.order { counter-reset: step; }
.order li::before { counter-increment: step; content: counter(step); flex: none; width: 1.6em; height: 1.6em; display: inline-grid; place-items: center; border-radius: 50%; background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: 13px; }
.ref { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 36px; padding: 4px 14px; border: 1px solid var(--gold-strong); border-radius: 99px; background: transparent; font-size: 14px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.ref:active { background: var(--gold-soft); }
.ref-go { font-size: 12px; font-weight: 500; color: var(--muted); }
.rf-src { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--gold); }
.rf-note { margin: 0; font-size: 13px; color: var(--muted); }
.rf-body { display: grid; gap: 4px; font-family: var(--font-scripture); font-size: var(--reader-size, 18px); line-height: 1.85; word-break: keep-all; overflow-wrap: anywhere; }
.rf-v { margin: 0; }
.rf-v sup { font-family: var(--font-ui); font-size: .62em; font-weight: 600; color: var(--gold); margin-right: .4em; vertical-align: .45em; font-variant-numeric: tabular-nums; }
.v.flash { animation: flash 2s ease-out; }
@keyframes flash { 0%, 45% { background: var(--gold-soft); } 100% { background: transparent; } }
.hint { margin: 0; padding: 0 20px 16px; text-align: center; font-size: 13px; color: var(--muted); }
.card.revealed .hint { display: none; }

.end { margin: auto; text-align: center; display: grid; gap: 10px; justify-items: center; padding: 24px; }
.end svg { width: 54px; height: 54px; color: var(--gold-strong); }
.end h2 { margin: 0; font-family: var(--font-display); font-size: 26px; text-wrap: balance; }
.end p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.end-actions { display: grid; gap: 8px; width: min(280px, 100%); margin-top: 8px; }

.controls { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 10px; max-width: 560px; margin-inline: auto; padding-block: 0 12px; }
.ctrl { height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; }
.ctrl:disabled { opacity: .4; cursor: default; }
.ctrl.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ctrl.wide { width: 100%; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateX(var(--nudge, 12px)); } 60% { transform: translateX(calc(var(--nudge, 12px) * -.4)); } }
.card.nudge { animation: nudge .32s ease; }

/* ---------- Bible ---------- */
.rl { padding-block: 20px 28px; max-width: 760px; margin-inline: auto; }
.eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--gold); }
.rl h1 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.25; text-wrap: balance; }
.read-prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.read-prog b { color: var(--ink); }
.continue { margin-top: 16px; width: 100%; height: 50px; border-radius: 14px; border: 0; background: var(--ink); color: var(--bg); font-weight: 600; }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px; margin-top: 22px; }
.ch {
  position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.ch b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-weight: 700; }
.ch small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch.read { background: var(--gold-soft); border-color: var(--gold-strong); }
.ch.read b { color: var(--gold); }
.ch.read::after { content: "읽음"; position: absolute; top: 5px; right: 7px; font-size: 10px; font-weight: 700; color: var(--gold); }
.ch.last { outline: 2px dashed var(--gold-strong); outline-offset: 2px; }
.src-note { margin: 22px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }

.rd-head { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.rd-head-inner { display: flex; align-items: center; gap: 8px; height: 56px; max-width: 760px; margin-inline: auto; }
.icon-btn { flex: none; min-width: 40px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 14px; font-weight: 600; }
.icon-btn svg { width: 18px; height: 18px; }
.rd-title { flex: 1; min-width: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 19px; white-space: nowrap; }
.rd-title small { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--muted); margin-right: 6px; }
.text { max-width: 38em; margin-inline: auto; padding-block: 18px 26px; font-family: var(--font-scripture); font-size: var(--reader-size, 18px); line-height: 1.95; word-break: keep-all; overflow-wrap: anywhere; }
.v { margin: 0 0 .3em; padding: 1px 6px; border-radius: 8px; }
.v sup { font-family: var(--font-ui); font-size: .6em; font-weight: 600; color: var(--muted); margin-right: .4em; vertical-align: .5em; font-variant-numeric: tabular-nums; }
.v.has-q { cursor: pointer; text-decoration: underline dotted var(--gold-strong); text-decoration-thickness: 1.5px; text-underline-offset: .32em; }
.v.has-q sup { color: var(--gold); }
.v.has-q:hover, .v.has-q.active { background: var(--gold-soft); }
.v.missing { color: var(--muted); }
.rd-end { max-width: 38em; margin-inline: auto; padding-block: 4px 30px; display: grid; gap: 10px; }
.read-toggle { height: 54px; border-radius: 14px; border: 1.5px solid var(--gold-strong); background: transparent; color: var(--gold); font-weight: 700; font-size: 16px; }
.read-toggle[aria-pressed="true"] { background: var(--gold-soft); }
.rd-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rd-nav button, .rd-quiz { height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.rd-nav button:disabled { opacity: .35; cursor: default; }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--surface); }
.tab { height: 58px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--gold-strong); }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.sheet {
  position: fixed; z-index: 21; left: 50%; bottom: 0; transform: translateX(-50%); width: min(620px, 100%); max-height: 86%;
  display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheetIn .22s ease-out;
}
@keyframes sheetIn { from { transform: translate(-50%, 24px); } to { transform: translate(-50%, 0); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 6px; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 20px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 12px; display: grid; gap: 20px; align-content: start; }
.sheet-actions { padding-block: 10px 16px; border-top: 1px solid var(--line); }
.fs-sec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 42px; height: 38px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .cnt { font-size: 11px; opacity: .7; margin-left: 3px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.vq { width: 100%; text-align: left; display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.vq-q { font-size: 15px; word-break: keep-all; }
.vq-a { font-size: 14px; color: var(--muted); }
.vq-a b { color: var(--gold); font-size: 16px; }
.vq:not(.open) .vq-a b { filter: blur(6px); }

/* ---------- Translation + import ---------- */
.trans-card { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); display: grid; gap: 10px; }
.trans-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.trans-label { font-size: 13px; font-weight: 600; color: var(--muted); }
.seg.small { grid-template-columns: auto auto; }
.seg.small .chip { height: 34px; }
.trans-status { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trans-status b { color: var(--ink); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); vertical-align: middle; margin: 0 2px; }
.link-btn { justify-self: start; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--gold-strong); background: var(--gold-soft); color: var(--gold); font-weight: 600; font-size: 14px; }
.link-btn.danger { border-color: var(--no); background: transparent; color: var(--no); }
.ch.gae::before { content: ""; position: absolute; top: 7px; left: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.rd-banner { font-family: var(--font-ui); font-size: 14px; line-height: 1.55; display: grid; gap: 8px; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.rd-banner p { margin: 0; }
.im-help { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
.im-field { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.im-field select { flex: 1; min-width: 0; height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 400; }
#imText { width: 100%; min-height: 150px; resize: vertical; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--font-scripture); font-size: 15px; line-height: 1.7; }
.im-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.im-file { display: grid; place-items: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
.im-result:empty { display: none; }
.im-result { display: grid; gap: 6px; font-size: 14px; }
.im-result .msg { margin: 0; color: var(--muted); }
.im-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.im-list li { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.im-list li.ok b::after { content: " ✓"; color: var(--ok); }
.im-list li.warn { border-color: var(--gold-strong); }
.im-list li span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (min-width: 720px) {
  .q { font-size: 28px; }
}
</style>

<body>
<div class="app">
  <section class="view" id="view-quiz" aria-label="퀴즈">

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function matches(f) {
  return QUIZ.filter((q) => (!f.chs.length || f.chs.includes(q.ch)) && (!f.types.length || f.types.includes(q.t)) && (!f.star || state.stars.has(q.n)));
}
function buildDeck(f) {
  const list = matches(f).map((q) => q.n);
  state.filter = f;
  state.deck = f.order === "shuffle" ? shuffle(list) : list;
  state.idx = 0;
  state.revealed = false;
  store.set("filter", f); store.set("deck", state.deck); store.set("idx", 0);
}
function deckLabel(f) {
  const parts = [];
  parts.push(f.chs.length ? f.chs.slice().sort((a, b) => (a || 99) - (b || 99)).map((c) => (c === 0 ? "종합" : c + "장")).join("·") : "전체");
  if (f.types.length) parts.push(f.types.join("·"));
  if (f.star) parts.push("★만");
  parts.push(f.order === "shuffle" ? "섞기" : "순서대로");
  return parts.join(" · ");
}

/* ---------- Card rendering ---------- */
function answerBlock(q) {
  const ref = `<button class="ref" type="button" data-act="ref" aria-label="눅 ${esc(q.ref)} 본문 보기">눅 ${esc(q.ref)}<span class="ref-go" aria-hidden="true">본문 보기 ›</span></button>`;
  if (q.t === "객관식") return ref;
  if (q.t === "빈칸" && q.blank) return (q.an ? `<div class="ans-note">${esc(q.an)}</div>` : "") + ref;
  if (q.t === "OX") {
    return `<div class="ox-row"><span class="ox-mark ${q.ox === "O" ? "o" : "x"}" aria-label="정답 ${q.ox}">${q.ox}</span>${q.an ? `<span class="ans-note">${esc(q.an)}</span>` : ""}</div>${ref}`;
  }
  if (q.t === "연결" && q.pairs) {
    const L = Object.fromEntries(q.left.map((x) => [x.k, x.text]));
    const R = Object.fromEntries(q.right.map((x) => [x.k, x.text]));
    return `<div class="ans-label">정답</div><ul class="pairs">${q.pairs.map(([l, r]) => `<li><span>${esc(L[l] || l)}</span><span class="arrow">→</span><span>${esc(R[r] || r)}</span></li>`).join("")}</ul>${ref}`;
  }
  if (q.t === "순서" && q.order) {
    const I = Object.fromEntries(q.items.map((x) => [x.k, x.text]));
    return `<div class="ans-label">정답</div><ol class="order">${q.order.map((k) => `<li><span>${esc(I[k] || k)}</span></li>`).join("")}</ol>${ref}`;
  }
  return `<div class="ans-label">정답</div><div class="ans">${esc(q.am)}</div>${q.an ? `<div class="ans-note">${esc(q.an)}</div>` : ""}${ref}`;
}
function questionBlock(q) {
  const quote = (s) => esc(s).replace(/^&quot;/, "“").replace(/&quot;$/, "”");
  switch (q.t) {
    case "객관식":
      return `<p class="q">${esc(q.stem)}</p><ol class="choices">${q.choices.map((c, i) => `<li class="${i === q.ci ? "correct" : ""}"><span class="num">${CIRCLED[i]}</span><span>${esc(c)}</span></li>`).join("")}</ol>`;
    case "빈칸":
      if (q.blank) return `<p class="q quote">${quote(q.q).replace(/\(\s+\)/g, `<span class="blank"><span class="fill">${esc(q.am)}</span></span>`)}</p>`;
      return `<p class="q quote">${quote(q.q)}</p>`;
    case "누가 말했나":
      return `<p class="prompt">누가 말했을까요?</p><p class="q quote">${quote(q.q)}</p>`;
    case "연결":
      if (!q.left) break;
      return `<p class="q">${esc(q.stem)}</p><div class="match"><ul>${q.left.map((x) => `<li><span class="k">${x.k}</span><span>${esc(x.text)}</span></li>`).join("")}</ul><ul>${q.right.map((x) => `<li><span class="k">${x.k}</span><span>${esc(x.text)}</span></li>`).join("")}</ul></div>`;
    case "순서":
      if (!q.items) break;
      return `<p class="q">${esc(q.stem)}</p><ul class="items">${q.items.map((x) => `<li><span class="k">${x.k}</span><span>${esc(x.text)}</span></li>`).join("")}</ul>`;
  }
  return `<p class="q">${esc(q.q)}</p>`;
}

const card = $("#card");
function renderCard() {
  const deck = state.deck;
  const total = deck.length;
  const atEnd = state.idx >= total;
  card.classList.toggle("revealed", state.revealed && !atEnd);
  $("#deckLabel").textContent = deckLabel(state.filter);
  $("#progText").innerHTML = total ? `<b>${Math.min(state.idx + 1, total)}</b> / ${total}` : "0 / 0";
  $("#progBar").style.width = total ? ((Math.min(state.idx + 1, total) / total) * 100).toFixed(2) + "%" : "0";
  $("#starInfo").textContent = "★ " + state.stars.size;
  $("#prevBtn").disabled = state.idx <= 0;
  $("#nextBtn").disabled = atEnd;
  $("#revealBtn").disabled = atEnd;
  $("#revealBtn").textContent = state.revealed ? "정답 숨기기" : "정답 보기";

  if (!total) {
    card.innerHTML = `<div class="end">${BELL}<h2>${state.filter.star ? "★ 표시한 문제가 없어요" : "조건에 맞는 문제가 없어요"}</h2><p>${state.filter.star ? "카드 오른쪽 위 ☆를 누르면 다시 볼 문제로 모입니다." : "범위를 넓혀 보세요."}</p><div class="end-actions"><button class="ctrl primary" type="button" data-act="all">전체 문제로</button><button class="ctrl" type="button" data-act="filter">범위 설정</button></div></div>`;
    return;
  }
  if (atEnd) {
    const starInDeck = deck.filter((n) => state.stars.has(n)).length;
    card.innerHTML = `<div class="end">${BELL}<h2>끝까지 넘겼어요</h2><p>${total}문제 · 이 중 ★ ${starInDeck}개</p><div class="end-actions"><button class="ctrl primary" type="button" data-act="restart">처음부터 다시</button><button class="ctrl" type="button" data-act="shuffle">섞어서 다시</button><button class="ctrl" type="button" data-act="stars" ${state.stars.size ? "" : "disabled"}>★ 문제만 풀기 (${state.stars.size})</button></div></div>`;
    return;
  }
  const q = byNo.get(deck[state.idx]);
  const starred = state.stars.has(q.n);
  card.innerHTML =
    `<div class="card-top"><span class="badge">${esc(q.t)}</span><span class="qno">No. ${q.n}${q.ch ? " · " + q.ch + "장" : " · 종합"}</span>` +
    `<button class="star" type="button" data-act="star" aria-pressed="${starred}" aria-label="다시 볼 문제로 표시">${starred ? "★" : "☆"}</button></div>` +
    `<div class="card-body">${questionBlock(q)}</div>` +
    `<div class="answer-area">${answerBlock(q)}</div>` +
    `<p class="hint">탭하면 정답 · 옆으로 밀면 다음 문제</p>`;
}

function setReveal(on) {
  if (state.idx >= state.deck.length) return;
  state.revealed = on;
  card.classList.toggle("revealed", on);
  $("#revealBtn").textContent = on ? "정답 숨기기" : "정답 보기";
}

let busy = false;
function nudge(dir) {
  card.style.setProperty("--nudge", (dir > 0 ? -14 : 14) + "px");
  card.classList.remove("nudge"); void card.offsetWidth; card.classList.add("nudge");
}
function go(delta) {
  if (busy) return;
  const next = state.idx + delta;
  if (next < 0 || next > state.deck.length) { snapBack(); nudge(delta); return; }
  const finish = () => {
    state.idx = next; state.revealed = false; store.set("idx", next);
    renderCard();
    if (reduced) { card.style.transform = ""; card.style.opacity = ""; busy = false; return; }
    card.style.transition = "none";
    card.style.transform = `translateX(${delta * 28}%)`;
    card.style.opacity = "0";
    void card.offsetWidth;
    card.style.transition = "transform .22s ease-out, opacity .22s ease-out";
    card.style.transform = ""; card.style.opacity = "";
    setTimeout(() => { busy = false; }, 220);
  };
  busy = true;
  if (reduced) { finish(); return; }
  card.style.transition = "transform .2s ease-in, opacity .2s ease-in";
  card.style.transform = `translateX(${-delta * 115}%) rotate(${-delta * 9}deg)`;
  card.style.opacity = "0";
  setTimeout(finish, 190);
}
function snapBack() {
  card.style.transition = reduced ? "none" : "transform .2s ease-out";
  card.style.transform = "";
}

/* Gestures: touch is handled with touch events so a horizontal drag can claim the gesture
   (preventDefault) before the browser starts scrolling the card body; mouse and pen use pointer events. */
let drag = null;
const onButton = (t) => !!(t && t.closest && t.closest("button, a, input, textarea, select, label"));
function dragStart(x, y, target) {
  drag = null;
  if (busy || onButton(target)) return;
  drag = { x, y, dx: 0, v: 0, lt: performance.now(), active: false, dead: false };
}
function dragMove(x, y) {
  if (!drag || drag.dead) return false;
  const dx = x - drag.x, dy = y - drag.y;
  if (!drag.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.active = true; card.style.transition = "none"; }
    else { if (Math.abs(dy) > 10) drag.dead = true; return false; }
  }
  const now = performance.now();
  drag.v = (dx - drag.dx) / Math.max(1, now - drag.lt);
  drag.lt = now; drag.dx = dx;
  card.style.transform = `translateX(${dx}px) rotate(${dx / 26}deg)`;
  return true;
}
function dragEnd(target) {
  const d = drag; drag = null;
  if (!d) return;
  if (d.active) {
    const far = Math.abs(d.dx) > Math.min(90, card.offsetWidth * 0.2);
    const flick = Math.abs(d.dx) > 30 && Math.abs(d.v) > 0.35 && Math.sign(d.v) === Math.sign(d.dx);
    if (far || flick) go(d.dx < 0 ? 1 : -1); else snapBack();
  } else if (!d.dead && !onButton(target)) {
    setReveal(!state.revealed);
  }
}
function dragCancel() { if (drag && drag.active) snapBack(); drag = null; }

card.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch" || e.button !== 0) return;
  dragStart(e.clientX, e.clientY, e.target);
  if (drag) { try { card.setPointerCapture(e.pointerId); } catch (err) {} }
});
card.addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") dragMove(e.clientX, e.clientY); });
card.addEventListener("pointerup", (e) => { if (e.pointerType !== "touch") dragEnd(e.target); });
card.addEventListener("pointercancel", (e) => { if (e.pointerType !== "touch") dragCancel(); });

card.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { dragCancel(); return; }
  const t = e.touches[0];
  dragStart(t.clientX, t.clientY, e.target);
}, { passive: true });
card.addEventListener("touchmove", (e) => {
  if (!drag) return;
  const t = e.touches[0];
  if (dragMove(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
}, { passive: false });
card.addEventListener("touchend", (e) => {
  if (!drag) return;
  const handled = drag.active || !drag.dead;
  dragEnd(e.target);
  if (handled && e.cancelable && !onButton(e.target)) e.preventDefault();
}, { passive: false });
card.addEventListener("touchcancel", dragCancel);

card.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "star") {
    const n = state.deck[state.idx];
    if (state.stars.has(n)) state.stars.delete(n); else state.stars.add(n);
    store.set("stars", [...state.stars]);
    b.setAttribute("aria-pressed", String(state.stars.has(n)));
    b.textContent = state.stars.has(n) ? "★" : "☆";
    $("#starInfo").textContent = "★ " + state.stars.size;
  } else if (act === "restart") { state.idx = 0; state.revealed = false; store.set("idx", 0); renderCard(); }
  else if (act === "shuffle") { buildDeck({ ...state.filter, order: "shuffle" }); renderCard(); }
  else if (act === "stars") { buildDeck({ chs: [], types: [], star: true, order: state.filter.order }); renderCard(); }
  else if (act === "all") { buildDeck({ chs: [], types: [], star: false, order: "seq" }); renderCard(); }
  else if (act === "filter") openFilter();
  else if (act === "ref") openRef(byNo.get(state.deck[state.idx]));
});

/* ---------- Reference verses (tap "눅 1:80" on a card) ---------- */
function openRef(q) {
  if (!q) return;
  $("#rfTitle").textContent = "눅 " + q.ref;
  const rows = q.vs.map(([chapter, verse]) => {
    const key = chapter + ":" + verse;
    const passage = state.gae[chapter]?.[verse - 1] || (NONE_VERSES.has(key) ? "(없음)" : "개역개정 본문을 가져오면 표시됩니다.");
    return `<p class="rf-v"><button type="button" class="link-btn" data-chapter="${chapter}" data-verse="${verse}" aria-label="${chapter}장 ${verse}절 성경읽기에서 열기">${key} ›</button> ${esc(passage)}</p>`;
  });
  $("#rfWrap").innerHTML = `<p class="rf-src">개역개정 · 절 번호를 누르면 성경읽기로 이동합니다</p><div class="rf-body" style="--reader-size:${state.font}px">${rows.join("")}</div>`;
  showSheet($("#refSheet"));
}
$("#rfWrap").addEventListener("click", (event) => {
  const button = event.target.closest("[data-verse]");
  if (!button) return;
  closeSheets();
  goToVerse(Number(button.dataset.chapter), Number(button.dataset.verse));
});
function goToVerse(c, v) {
  setTab("bible");
  openChapter(c);
  const el = document.getElementById("v" + v);
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

$("#prevBtn").addEventListener("click", () => go(-1));
$("#nextBtn").addEventListener("click", () => go(1));
$("#revealBtn").addEventListener("click", () => setReveal(!state.revealed));

document.addEventListener("keydown", (e) => {
  if (openSheet) { if (e.key === "Escape") closeSheets(); return; }
  if (state.tab !== "quiz") return;
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); setReveal(!state.revealed); }
  else if (e.key === "s" || e.key === "S") { const b = $(".star", card); if (b) b.click(); }
});

/* ---------- Sheets ---------- */
let openSheet = null;
let lastFocus = null;
function showSheet(el) {
  lastFocus = document.activeElement;
  $("#scrim").hidden = false; el.hidden = false; openSheet = el;
  const f = el.querySelector("[data-close]"); if (f) f.focus();
}
function closeSheets() {
  $("#scrim").hidden = true;
  document.querySelectorAll(".sheet").forEach((s) => { s.hidden = true; });
  document.querySelectorAll(".v.active").forEach((v) => v.classList.remove("active"));
  openSheet = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$("#scrim").addEventListener("click", closeSheets);
document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closeSheets));

let draft = null;
function openFilter() { draft = JSON.parse(JSON.stringify(state.filter)); renderFilter(); showSheet($("#filterSheet")); }
function toggleIn(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function renderFilter() {
  const chs = [`<button class="chip" type="button" data-ch="all" aria-pressed="${!draft.chs.length}">전체</button>`];
  for (let c = 1; c <= 24; c++) chs.push(`<button class="chip" type="button" data-ch="${c}" aria-pressed="${draft.chs.includes(c)}" aria-label="${c}장 ${qCountByCh[c]}문제">${c}</button>`);
  chs.push(`<button class="chip" type="button" data-ch="0" aria-pressed="${draft.chs.includes(0)}">종합<span class="cnt">${qCountByCh[0]}</span></button>`);
  $("#fsCh").innerHTML = chs.join("");
  const typeCounts = Object.fromEntries(TYPES.map((t) => [t, QUIZ.filter((q) => q.t === t).length]));
  $("#fsType").innerHTML = [`<button class="chip" type="button" data-type="all" aria-pressed="${!draft.types.length}">전체</button>`]
    .concat(TYPES.map((t) => `<button class="chip" type="button" data-type="${t}" aria-pressed="${draft.types.includes(t)}">${t}<span class="cnt">${typeCounts[t]}</span></button>`)).join("");
  document.querySelectorAll("#fsOrder .chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === draft.order)));
  $("#fsStar").setAttribute("aria-pressed", String(draft.star));
  $("#fsStar").textContent = `★ 표시한 문제만 (${state.stars.size})`;
  const n = matches(draft).length;
  $("#fsApply").textContent = n ? `${n}문제로 시작` : "조건에 맞는 문제가 없어요";
  $("#fsApply").disabled = !n;
}
$("#fsCh").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ch]"); if (!b) return;
  if (b.dataset.ch === "all") draft.chs = []; else toggleIn(draft.chs, Number(b.dataset.ch));
  renderFilter();
});
$("#fsType").addEventListener("click", (e) => {
  const b = e.target.closest("[data-type]"); if (!b) return;
  if (b.dataset.type === "all") draft.types = []; else toggleIn(draft.types, b.dataset.type);
  renderFilter();
});
$("#fsOrder").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (!b) return; draft.order = b.dataset.v; renderFilter(); });
$("#fsStar").addEventListener("click", () => { draft.star = !draft.star; renderFilter(); });
$("#fsApply").addEventListener("click", () => { buildDeck(draft); closeSheets(); renderCard(); });
$("#deckBtn").addEventListener("click", openFilter);

/* ---------- Bible ---------- */
function renderList() {
  const done = state.read.size;
  const cont = nextToRead();
  const tiles = [];
  for (let c = 1; c <= 24; c++) {
    const verses = verseCounts[c - 1];
    const hasGae = Array.isArray(state.gae[c]) && state.gae[c].some(Boolean);
    tiles.push(`<button class="ch${state.read.has(c) ? " read" : ""}${state.lastCh === c ? " last" : ""}${hasGae ? " gae" : ""}" type="button" data-ch="${c}" aria-label="${c}장${state.read.has(c) ? ", 읽음" : ""}${hasGae ? ", 개역개정 있음" : ""}"><b>${c}</b><small>${verses}절</small><small>문제 ${qCountByCh[c]}</small></button>`);
  }
  const g = gaeCount();
  $("#bibleList").innerHTML =
    `<div class="gutter"><div class="rl">` +
    `<p class="eyebrow">개역개정 · 24장</p><h1>누가복음 통독</h1>` +
    `<div class="read-prog"><div class="bar"><i style="width:${((done / 24) * 100).toFixed(1)}%"></i></div><span><b>${done}</b> / 24장 읽음</span></div>` +
    `<button class="continue" type="button" data-ch="${cont}">${done === 24 ? "다 읽었어요 · 1장부터 다시 보기" : (state.lastCh ? cont + "장부터 이어 읽기" : "1장부터 읽기")}</button>` +
    `<div class="trans-card">` +
      `<p class="trans-status">개역개정 본문 <b>${g}</b> / 24장 가져옴${g ? ' · <span class="dot"></span> 표시된 장' : ""}</p>` +
      `<button class="link-btn" type="button" data-act="import">개역개정 가져오기</button>` +
    `</div>` +
    `<div class="ch-grid">${tiles.join("")}</div>` +
    `<p class="src-note">개역개정 본문은 저작권 때문에 앱에 들어 있지 않고, 직접 가져온 본문이 이 기기에만 저장됩니다. 점선 밑줄이 있는 절은 퀴즈에 나온 절이고, 누르면 관련 문제를 볼 수 있어요.</p>` +
    `</div></div>`;
}
function nextToRead() {
  if (state.lastCh && !state.read.has(state.lastCh)) return state.lastCh;
  const start = state.lastCh || 1;
  for (let i = 0; i < 24; i++) { const c = ((start - 1 + i) % 24) + 1; if (!state.read.has(c)) return c; }
  return 1;
}
$("#bibleList").addEventListener("click", (e) => {
  if (e.target.closest("[data-act='import']")) { openImport(null); return; }
  const b = e.target.closest("[data-ch]"); if (!b) return;
  openChapter(Number(b.dataset.ch));
});

function openChapter(c) {
  state.readerCh = c; state.lastCh = c;
  store.set("readerCh", c); store.set("lastCh", c);
  renderReader();
  $("#bibleList").hidden = true; $("#bibleReader").hidden = false;
  $("#bibleReader").scrollTop = 0;
}
function closeReader() {
  state.readerCh = null; store.set("readerCh", null);
  renderList();
  $("#bibleReader").hidden = true; $("#bibleList").hidden = false;
}
function renderReader() {
  const c = state.readerCh;
  const imported = Array.isArray(state.gae[c]) && state.gae[c].some(Boolean);

  const verses = state.gae[c] || [];
  const count = imported ? verseCounts[c - 1] : 0;
  $("#rdTitle").innerHTML = `<small>개역개정</small>${c}장`;
  $("#rdText").style.setProperty("--reader-size", state.font + "px");
  const banner = !imported
    ? `<div class="rd-banner"><p>개역개정 파일을 가져오면 이 장을 읽을 수 있어요.</p><button class="link-btn" type="button" data-act="import-ch">${c}장 개역개정 붙여넣기</button></div>`
    : "";
  const rows = [];
  for (let i = 0; i < count; i++) {
    const t = verses[i], v = i + 1, key = c + ":" + v, qs = verseQs.get(key);
    if (t == null) {
      const label = !NONE_VERSES.has(key) ? "(가져온 본문에 이 절이 없어요)" : "(없음)";
      rows.push(`<p class="v missing" id="v${v}"><sup>${v}</sup>${label}</p>`);
    } else if (qs) rows.push(`<p class="v has-q" id="v${v}" data-key="${key}" tabindex="0" role="button" aria-label="${v}절, 관련 문제 ${qs.length}개"><sup>${v}</sup>${esc(t)}</p>`);
    else rows.push(`<p class="v" id="v${v}"><sup>${v}</sup>${esc(t)}</p>`);
  }
  $("#rdText").innerHTML = banner + rows.join("");
  const isRead = state.read.has(c);
  $("#readToggle").setAttribute("aria-pressed", String(isRead));
  $("#readToggle").textContent = isRead ? `✓ ${c}장 읽음` : `${c}장 다 읽었어요`;
  $("#rdQuiz").textContent = `${c}장 문제 ${qCountByCh[c]}개 풀기`;
  $("#rdPrev").disabled = c <= 1; $("#rdPrev").textContent = c > 1 ? `‹ ${c - 1}장` : "‹";
  $("#rdNext").disabled = c >= 24; $("#rdNext").textContent = c < 24 ? `${c + 1}장 ›` : "›";
}
function stepChapter(d) {
  const c = state.readerCh + d;
  if (c < 1 || c > 24) return;
  openChapter(c);
}
$("#rdBack").addEventListener("click", closeReader);
$("#rdPrev").addEventListener("click", () => stepChapter(-1));
$("#rdNext").addEventListener("click", () => stepChapter(1));
$("#fontDown").addEventListener("click", () => { state.font = Math.max(15, state.font - 1); store.set("font", state.font); $("#rdText").style.setProperty("--reader-size", state.font + "px"); });
$("#fontUp").addEventListener("click", () => { state.font = Math.min(26, state.font + 1); store.set("font", state.font); $("#rdText").style.setProperty("--reader-size", state.font + "px"); });
$("#readToggle").addEventListener("click", () => {
  const c = state.readerCh;
  if (state.read.has(c)) state.read.delete(c); else state.read.add(c);
  store.set("read", [...state.read]);
  renderReader();
});
function quizChapter(c) {
  buildDeck({ chs: [c], types: [], star: false, order: "seq" });
  setTab("quiz");
  renderCard();
}
$("#rdQuiz").addEventListener("click", () => quizChapter(state.readerCh));

let vsChapter = null;
function openVerse(el) {
  const key = el.dataset.key, [c, v] = key.split(":").map(Number);
  const nums = verseQs.get(key) || [];
  vsChapter = c;
  el.classList.add("active");
  $("#vsTitle").textContent = `눅 ${c}:${v} 관련 문제`;
  $("#vsBody").innerHTML = nums.map((n) => {
    const q = byNo.get(n);
    return `<button class="vq" type="button"><span><span class="badge">${esc(q.t)}</span> <span class="qno">No. ${q.n}</span></span><span class="vq-q">${esc(q.q)}</span><span class="vq-a">정답 <b>${esc(q.a)}</b> · 눌러서 보기</span></button>`;
  }).join("");
  $("#vsQuiz").textContent = `${c}장 문제 ${qCountByCh[c]}개 풀기`;
  showSheet($("#verseSheet"));
}
$("#vsBody").addEventListener("click", (e) => { const b = e.target.closest(".vq"); if (b) b.classList.toggle("open"); });
$("#vsQuiz").addEventListener("click", () => { closeSheets(); quizChapter(vsChapter); });
$("#rdText").addEventListener("click", (e) => {
  if (e.target.closest("[data-act='import-ch']")) { openImport(state.readerCh); return; }
  const v = e.target.closest(".v.has-q"); if (v) openVerse(v);
});
$("#rdText").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const v = e.target.closest(".v.has-q"); if (v) { e.preventDefault(); openVerse(v); }
});

let tStart = null;
$("#bibleReader").addEventListener("touchstart", (e) => { const t = e.touches[0]; tStart = { x: t.clientX, y: t.clientY, time: Date.now() }; }, { passive: true });
$("#bibleReader").addEventListener("touchend", (e) => {
  if (!tStart) return;
  const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
  const quick = Date.now() - tStart.time < 600;
  tStart = null;
  if (quick && Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2 && !window.getSelection().toString()) stepChapter(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- 개역개정 import (user-supplied text, stored on this device only) ---------- */
// A chapter title line: short, ends in "N장" (e.g. "누가복음 3장", "[개역개정] 누가복음 제3장", "3장").
const HEADER_LINE = (l) => l.length <= 30 ? l.match(/(?:^|[\s\]】)복음])(?:제\s*)?(\d{1,2})\s*장\s*(?:[\[(（【].*)?$/) : null;
const HEADER2_RE = /^\s*(?:[\[(【][^\])】]*[\])】]\s*)?(?:누가복음|눅)\s*(\d{1,2})\s*$/;
const CV_RE = /^\s*(?:누가복음|눅)?\s*(\d{1,2})\s*:\s*(\d{1,3})\s*(.*)$/;

function cleanImport(s) {
  return s.replace(/\r\n?/g, "\n").replace(/[\u00a0\u2009\u200b\ufeff]/g, " ")
    .split("\n").filter((l) => !/^\s*\d+\)\s/.test(l)).join("\n")
    .replace(/([가-힣.,!?”’"'])\d+\)/g, "$1");
}
function splitVerses(block) {
  const find = (n, from) => {
    const re = new RegExp("(^|[\\s.,;:?!\"'”’)\\]】」>])(" + n + ")(?=\\s*[가-힣\"“‘'(\\[<「【])", "g");
    re.lastIndex = from;
    const m = re.exec(block);
    return m ? { start: m.index + m[1].length, end: m.index + m[1].length + m[2].length, n } : null;
  };
  const starts = [];
  let cur = find(1, 0);
  while (cur) {
    starts.push(cur);
    const a = find(cur.n + 1, cur.end), b = find(cur.n + 2, cur.end);
    cur = a && (!b || a.start < b.start) ? a : b;
  }
  if (!starts.length) return null;
  const lineMode = starts.filter((s) => s.start === 0 || block[s.start - 1] === "\n").length >= starts.length * 0.7;
  const verses = [];
  starts.forEach((s, i) => {
    let t = block.slice(s.end, i + 1 < starts.length ? starts[i + 1].start : block.length).replace(/^\s+/, "");
    if (lineMode) t = t.split("\n")[0];
    verses[s.n - 1] = t;
  });
  return verses;
}
function parseImport(raw, forced) {
  const lines = cleanImport(raw).split("\n").map((l) => l.trim()).filter(Boolean);
  const out = {};
  const cvCount = lines.filter((l) => CV_RE.test(l)).length;
  if (cvCount >= 3 && cvCount >= lines.length * 0.6) {
    for (const l of lines) {
      const m = l.match(CV_RE);
      if (!m) continue;
      const c = +m[1], v = +m[2];
      if (c < 1 || c > 24 || v < 1) continue;
      (out[c] = out[c] || [])[v - 1] = m[3];
    }
  } else {
    const blocks = [];
    let cur = { ch: forced || null, lines: [] };
    for (const l of lines) {
      const h = HEADER_LINE(l) || l.match(HEADER2_RE);
      if (h && +h[1] >= 1 && +h[1] <= 24) {
        if (cur.lines.length) blocks.push(cur);
        cur = { ch: +h[1], lines: [] };
        continue;
      }
      cur.lines.push(l);
    }
    if (cur.lines.length) blocks.push(cur);
    for (const b of blocks) {
      if (!b.ch) continue;
      const vs = splitVerses(b.lines.join("\n"));
      if (vs) out[b.ch] = vs;
    }
  }
  for (const c of Object.keys(out)) {
    out[c] = Array.from(out[c], (t) => {
      if (t == null) return null;
      const s = String(t).replace(/\s+/g, " ").trim();
      return !s || /^\(?\s*없음\s*\)?$/.test(s) ? null : s;
    });
    if (!out[c].some(Boolean)) delete out[c];
  }
  return out;
}

let imParsed = null;
let clearArmed = 0;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}
function openImport(ch) {
  const sel = $("#imCh");
  sel.innerHTML = `<option value="auto">자동 인식 (장 제목이나 '장:절' 형식)</option>` +
    Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}">${i + 1}장${state.gae[i + 1] ? " (가져옴)" : ""}</option>`).join("");
  sel.value = ch ? String(ch) : "auto";
  $("#imText").value = "";
  $("#imResult").innerHTML = "";
  $("#imSave").disabled = true;
  imParsed = null;
  clearArmed = 0;
  renderClearBtn();
  showSheet($("#importSheet"));
}
function renderClearBtn() {
  const b = $("#imClear");
  const g = gaeCount();
  b.hidden = !g;
  b.textContent = clearArmed ? "한 번 더 누르면 모두 지워져요" : `가져온 개역개정 본문 지우기 (${g}장)`;
}
function runParse() {
  const raw = $("#imText").value;
  const forced = $("#imCh").value === "auto" ? null : Number($("#imCh").value);
  const res = $("#imResult");
  if (!raw.trim()) { res.innerHTML = `<p class="msg">붙여넣은 내용이 없어요.</p>`; $("#imSave").disabled = true; return; }
  imParsed = parseImport(raw, forced);
  const chs = Object.keys(imParsed).map(Number).sort((a, b) => a - b);
  if (!chs.length) {
    res.innerHTML = `<p class="msg">${forced ? "절 번호를 찾지 못했어요. 절 번호(1, 2, 3…)가 함께 복사됐는지 확인해 주세요." : "몇 장인지 알 수 없어요. 위에서 장을 고르거나 '누가복음 3장' 같은 제목 줄을 넣어 주세요."}</p>`;
    $("#imSave").disabled = true;
    return;
  }
  const items = chs.map((c) => {
    const vs = imParsed[c], expected = verseCounts[c - 1];
    const got = vs.slice(0, expected).filter(Boolean).length;
    const retained = (state.gae[c] || []).filter((text, i) => text && !vs[i]).length;
    const missing = [];
    for (let v = 1; v <= expected; v++) if (!vs[v - 1] && !state.gae[c]?.[v - 1] && !NONE_VERSES.has(c + ":" + v)) missing.push(v);
    const first = vs.find(Boolean) || "";
    const ok = !missing.length;
    return `<li class="${ok ? "ok" : "warn"}"><b>${c}장</b>${got}절 반영 · 기존 ${retained}절 유지${ok ? "" : ` · 빠진 절: ${missing.slice(0, 8).join(", ")}${missing.length > 8 ? " …" : ""}`}<span>${esc(first.slice(0, 40))}</span></li>`;
  });
  res.innerHTML = `<p class="msg">${chs.length}개 장을 인식했어요. 확인 후 저장하세요.</p><ul class="im-list">${items.join("")}</ul>`;
  $("#imSave").disabled = false;
}
$("#imParse").addEventListener("click", runParse);
$("#imFile").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    const buf = await f.arrayBuffer();
    let text = new TextDecoder("utf-8").decode(buf);
    if (text.includes("\ufffd")) { try { text = new TextDecoder("euc-kr").decode(buf); } catch (err) {} }
    $("#imText").value = text;
    runParse();
  } catch (err) { $("#imResult").innerHTML = `<p class="msg">파일을 읽지 못했어요. 텍스트(.txt) 파일인지 확인해 주세요.</p>`; }
  e.target.value = "";
});
$("#imSave").addEventListener("click", () => {
  if (!imParsed) return;
  const next = { ...state.gae };
  for (const [chapter, incoming] of Object.entries(imParsed)) {
    next[chapter] = Array.from({ length: verseCounts[chapter - 1] }, (_, index) =>
      incoming[index] || state.gae[chapter]?.[index] || null);
  }
  if (!store.set("gae", next)) { toast("저장 공간이 부족해서 저장하지 못했어요"); return; }
  state.gae = next;
  const n = Object.keys(imParsed).length;
  closeSheets();
  toast(`개역개정 ${n}개 장을 저장했어요`);
  if (state.readerCh) renderReader(); else renderList();
});
$("#imClear").addEventListener("click", () => {
  if (!clearArmed) { clearArmed = 1; renderClearBtn(); setTimeout(() => { clearArmed = 0; if (!$("#importSheet").hidden) renderClearBtn(); }, 4000); return; }
  state.gae = {}; store.set("gae", {});
  clearArmed = 0;
  closeSheets();
  toast("가져온 개역개정 본문을 지웠어요");
  if (state.readerCh) renderReader(); else renderList();
});

/* ---------- Tabs ---------- */
function setTab(t) {
  state.tab = t;
  $("#view-quiz").hidden = t !== "quiz";
  $("#view-bible").hidden = t !== "bible";
  $("#tab-quiz").setAttribute("aria-selected", String(t === "quiz"));
  $("#tab-bible").setAttribute("aria-selected", String(t === "bible"));
  if (t === "bible") {
    if (state.readerCh) { renderReader(); $("#bibleList").hidden = true; $("#bibleReader").hidden = false; }
    else { renderList(); $("#bibleReader").hidden = true; $("#bibleList").hidden = false; }
  }
  if (location.hash !== "#" + t) { try { history.replaceState(null, "", "#" + t); } catch (e) {} }
}
$("#tab-quiz").addEventListener("click", () => setTab("quiz"));
$("#tab-bible").addEventListener("click", () => setTab("bible"));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h === "quiz" || h === "bible") setTab(h); });

/* ---------- Start ---------- */
function start(data) {
  const valid = Array.isArray(state.deck) && state.deck.every((n) => byNo.has(n));
  if (!valid) buildDeck(state.filter && state.filter.chs ? state.filter : { chs: [], types: [], star: false, order: "seq" });
  if (valid && store.get("quizCount", 327) < QUIZ.length) {
    const missing = matches(state.filter).filter(q => q.n > store.get("quizCount", 327) && !state.deck.includes(q.n)).map(q => q.n);
    state.deck.push(...(state.filter.order === "shuffle" ? shuffle(missing) : missing));
    store.set("deck", state.deck);
  }
  store.set("quizCount", QUIZ.length);
  if (!(state.idx >= 0 && state.idx <= state.deck.length)) state.idx = 0;
  if (data && typeof data.revealed === "boolean") state.revealed = data.revealed;
  const h = location.hash.slice(1);
  setTab(data && data.tab ? data.tab : (h === "bible" ? "bible" : "quiz"));
  renderCard();
}
window.claude?.hot?.snapshot?.(() => ({ tab: state.tab, revealed: state.revealed }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); }); }
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
</script>
</body>
